services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: voi-api
    environment:
      DATABASE_URL: postgresql://voi:voi@postgres:5432/voi_dev?schema=public
      JWT_SECRET: replace-with-a-long-random-secret
      LOG_LEVEL: info
      API_HOST: 0.0.0.0
      API_PORT: 43187
      API_VERSION: v1
      APP_BASE_URL: http://localhost:43188
      DEFAULT_CURRENCY: VND
      CORS_ORIGINS: "*"
      RATE_LIMIT_MAX: 300
      RATE_LIMIT_WINDOW: "1 minute"
      REDIS_URL: redis://redis:6379
    ports:
      - "43187:43187"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: voi-redis
    ports:
      - "55479:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    container_name: voi-postgres
    environment:
      POSTGRES_USER: voi
      POSTGRES_PASSWORD: voi
      POSTGRES_DB: voi_dev
    ports:
      - "55487:5432"
    volumes:
      - voi-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voi -d voi_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  voi-postgres-data:
